<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag obrigatória para otimização em aparelhos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecionando para o WhatsApp...</title>
    
    <!-- Pré-conecta com o servidor do WhatsApp para acelerar o redirecionamento -->
    <link rel="preconnect" href="https://wa.me">

    <!-- COLOQUE SEU PIXEL AQUI EMBAIXO -->
    <!-- Ex: <script> Código do Pixel do Facebook/Kwai </script> -->

    <style>
        /* CSS Inline para zerar requisições externas e carregar instantaneamente */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #e0e0e0;
            border-top: 4px solid #25D366; /* Verde do WhatsApp */
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { 
            color: #4a4a4a; 
            font-size: 16px; 
            padding: 0 20px; 
            font-weight: 500;
        }
        .btn-fallback {
            display: none; /* Escondido por padrão, aparece se o JS falhar */
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Aguarde, conectando você ao nosso WhatsApp...</p>
    
    <!-- Botão de segurança caso a internet do usuário trave o redirecionamento automático -->
    <a href="#" class="btn-fallback" id="btn-fallback">Clique aqui para abrir o WhatsApp</a>

    <script>
        // ==========================================
        // CONFIGURAÇÕES DO WHATSAPP
        // ==========================================
        // Coloque seu número com DDI (55 para Brasil) e DDD. Ex: 5511999999999
        const numeroWhatsApp = "553175126925"; 
        
        // Mensagem padrão que o cliente vai enviar (opcional)
        const mensagemPadrao = "Olá! Tenho interesse e gostaria de saber mais.";
        
        // Monta o link final
        const linkDestino = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagemPadrao)}`;

        // Configura o link no botão de fallback
        document.getElementById('btn-fallback').href = linkDestino;

        // ==========================================
        // REDIRECIONAMENTO AUTOMÁTICO
        // ==========================================
        // Tempo em milissegundos (800ms) - Ideal para dar tempo do Pixel disparar antes de sair
        setTimeout(function() {
            window.location.href = linkDestino;
        }, 800);

        // Exibe o botão manualmente caso o redirecionamento demore mais de 3 segundos (ex: erro no navegador do cliente)
        setTimeout(function() {
            document.getElementById('btn-fallback').style.display = 'inline-block';
        }, 3000);
    </script>

</body>
</html>
