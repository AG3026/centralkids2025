<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag obrigatória para forçar o layout perfeito em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecionando para o WhatsApp...</title>
    
    <!-- Pré-conecta com a API do WhatsApp para carregar mais rápido -->
    <link rel="preconnect" href="https://api.whatsapp.com">

    <!-- ========================================== -->
    <!-- COLE O SEU PIXEL (META, KWAI, GOOGLE) AQUI -->
    <!-- ========================================== -->
    

    <style>
        /* CSS Inline: zero requisições externas para carregar instantaneamente */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .loader {
            border: 4px solid #e0e0e0;
            border-top: 4px solid #25D366; /* Cor verde do WhatsApp */
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { 
            color: #4a4a4a; 
            font-size: 16px; 
            padding: 0 20px; 
            font-weight: 500;
        }
        .btn-fallback {
            display: none; /* Fica escondido e só aparece se o redirecionamento falhar */
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
            transition: background-color 0.3s;
        }
        .btn-fallback:active {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Aguarde, conectando você ao nosso WhatsApp...</p>
    
    <!-- Botão de salvamento de lead caso a internet trave ou o navegador bloqueie -->
    <a href="#" class="btn-fallback" id="btn-fallback">Clique aqui para abrir o WhatsApp</a>

    <script>
        // ==========================================
        // 1. CONFIGURE SEU NÚMERO AQUI
        // ==========================================
        // Coloque DDI + DDD + NÚMERO. Exatamente como no exemplo, mantendo as aspas.
        const numeroWhatsApp = "553175126925"; 
        
        // Mensagem de gatilho que o cliente já vai enviar pronta
        const mensagemPadrao = "Olá! Tenho interesse no conteúdo e gostaria de saber mais.";
        
        // Monta o link agressivo usando a API oficial do WhatsApp
        const linkDestino = "https://api.whatsapp.com/send?phone=" + numeroWhatsApp + "&text=" + encodeURIComponent(mensagemPadrao);

        // Prepara o botão de segurança com o link correto
        document.getElementById('btn-fallback').href = linkDestino;

        // ==========================================
        // 2. LÓGICA DE REDIRECIONAMENTO E PROTEÇÃO
        // ==========================================
        
        // Dispara o redirecionamento após 800 milissegundos (dá tempo do Pixel registrar a visita)
        setTimeout(function() {
            // Utilizamos replace() para forçar a saída, ignorando alguns bloqueios de in-app browsers
            window.location.replace(linkDestino);
        }, 800);

        // Sistema de segurança: Se após 2.5 segundos o usuário ainda estiver na página 
        // (ex: erro na rede ou bloqueio do Kwai/Face), o botão verde aparece.
        setTimeout(function() {
            document.getElementById('btn-fallback').style.display = 'inline-block';
        }, 2500);
    </script>

</body>
</html>
